name: Greenhouse integration checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      greenhouse_board:
        description: 'Verified public Greenhouse board token (leave blank for database-only tests)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opportunity
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: opportunity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opportunity -d opportunity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opportunity:test-only-password@localhost:5432/opportunity_test
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://opportunity:test-only-password@localhost:5432/opportunity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              assert conn.execute("select 1").fetchone()[0] == 1
          print("PostgreSQL connection verified")
          PY
      - name: Run repository tests
        run: python -m pytest -q
      - name: Live Greenhouse persistence and idempotency evidence
        if: github.event_name == 'workflow_dispatch' && inputs.greenhouse_board != ''
        env:
          GREENHOUSE_BOARD: ${{ inputs.greenhouse_board }}
        run: python tests/greenhouse_live_e2e.py
