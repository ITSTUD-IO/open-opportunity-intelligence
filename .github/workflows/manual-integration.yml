name: Manual PostgreSQL integration test

# This workflow runs ONLY when manually started from GitHub Actions.
on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opportunity
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: opportunity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opportunity -d opportunity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://opportunity:test-only-password@localhost:5432/opportunity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
