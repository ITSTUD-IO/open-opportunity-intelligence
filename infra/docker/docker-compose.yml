services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: opportunity
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity -d opportunity"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
